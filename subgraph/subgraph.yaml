specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: BlOcXTacToe
    network: base
    source:
      address: "0x8C8Ab21D53EbFD5df68bc85Aa5538A7114d33F02"
      abi: BlOcXTacToe
      startBlock: 17000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Player
        - Game
        - Move
      abis:
        - name: BlOcXTacToe
          file: ./abis/BlOcXTacToe.json
      eventHandlers:
        - event: PlayerRegistered(indexed address,string)
          handler: handlePlayerRegistered
        - event: GameCreated(indexed uint256,indexed address,indexed address,uint256,uint8,address)
          handler: handleGameCreated
        - event: MoveMade(indexed uint256,indexed address,uint8,uint8,uint8)
          handler: handleMoveMade
        - event: GameFinished(indexed uint256,indexed address,uint8,uint256)
          handler: handleGameFinished
        - event: ChallengeCreated(indexed uint256,indexed address,indexed address,uint256,uint8,address)
          handler: handleChallengeCreated
      file: ./src/mapping.ts
